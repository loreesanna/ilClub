<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IL CLUB — Partite</title>
  <link rel="stylesheet" href="./style/main.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div class="topbar">
      <span class="topbar-title">PARTITE</span>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="add-btn" style="display:none" onclick="openModal()">+ Programma partita</button>
      </div>
    </div>
    <div class="page-content">
      <div class="section-header fade-up">
        <div>
          <div class="section-title">Calendario Partite</div>
          <div class="section-subtitle">Prossimi incontri programmati</div>
        </div>
        <select class="form-select" style="width:160px" id="filter-venue" onchange="render()">
          <option value="">Tutte</option>
          <option value="Casa">Casa</option>
          <option value="Trasferta">Trasferta</option>
        </select>
      </div>
      <div class="grid-auto fade-up delay-1" id="matches-grid">
        <div style="grid-column:1/-1;padding:2rem;text-align:center;color:var(--muted)">Caricamento...</div>
      </div>
      <div class="fade-up delay-2" style="margin-top:2.5rem">
        <div class="section-header">
          <div class="section-title" style="font-size:1.2rem">Lista completa</div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Data</th><th>Ora</th><th>Casa</th><th>Ospite</th>
                <th>Competizione</th><th>Sede</th>
                <th id="act-col" style="display:none">Azioni</th>
              </tr>
            </thead>
            <tbody id="matches-table"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Nuova Partita</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Data</label><input class="form-input" type="date" id="f-date"></div>
        <div class="form-group"><label class="form-label">Ora</label><input class="form-input" type="time" id="f-time" value="15:00"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Squadra Casa</label><input class="form-input" id="f-home" value="Il Club"></div>
        <div class="form-group"><label class="form-label">Squadra Ospite</label><input class="form-input" id="f-away"></div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Competizione</label>
          <select class="form-select" id="f-comp">
            <option>Serie A</option><option>Coppa</option><option>Amichevole</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Sede</label>
          <select class="form-select" id="f-venue">
            <option value="Casa">Casa</option>
            <option value="Trasferta">Trasferta</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:.5rem">
        <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
        <button class="btn btn-primary" onclick="saveMatch()">Salva</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="./js/app.js"></script>
<script src="./js/sidebar.js"></script>
<script>
let editingId = null;
let allUpcoming = [];
const months = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];

document.addEventListener('DOMContentLoaded', async () => {
  await AUTH.init();
  const can = AUTH.can('editMatch');
  if (can) {
    document.getElementById('add-btn').style.display = '';
    document.getElementById('act-col').style.display = '';
  }
  try {
    allUpcoming = await DB.getUpcoming();
  } catch(e) {
    UI.toast('Errore caricamento partite: ' + e.message, 'error');
  }
  render();
});

function render() {
  const venueF = document.getElementById('filter-venue').value;
  const can = AUTH.can('editMatch');
  const filtered = venueF ? allUpcoming.filter(m => m.venue === venueF) : allUpcoming;
  const sorted = [...filtered].sort((a,b) => new Date(a.date) - new Date(b.date));

  const grid = document.getElementById('matches-grid');
  if (sorted.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;padding:3rem;text-align:center;color:var(--muted)">Nessuna partita programmata</div>`;
  } else {
    grid.innerHTML = sorted.map(m => {
      const d = new Date(m.date);
      const daysLeft = Math.ceil((d - new Date()) / 86400000);
      const daysStr = daysLeft > 0 ? (daysLeft === 1 ? 'Domani' : `tra ${daysLeft} giorni`) : daysLeft === 0 ? 'Oggi' : 'Passata';
      return `<div class="card" style="cursor:default">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem">
          <div style="text-align:center;background:var(--surface2);border-radius:8px;padding:.5rem .75rem;min-width:50px">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--gold);line-height:1">${d.getDate()}</div>
            <div style="font-size:.65rem;text-transform:uppercase;color:var(--muted)">${months[d.getMonth()]}</div>
          </div>
          <span class="pill ${m.venue==='Casa'?'pill-blue':'pill-gray'}">${m.venue}</span>
        </div>
        <div style="text-align:center;margin-bottom:1rem">
          <div style="font-size:.8rem;color:var(--muted);margin-bottom:.5rem">${m.comp}</div>
          <div style="font-weight:700;font-size:.95rem;color:var(--white)">${m.home}</div>
          <div style="color:var(--muted);font-size:.75rem;margin:.35rem 0">vs</div>
          <div style="font-weight:700;font-size:.95rem;color:var(--white)">${m.away}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:.75rem;border-top:1px solid var(--border)">
          <span style="font-size:.8rem;color:var(--gold)">⏰ ${m.time}</span>
          <span style="font-size:.72rem;color:var(--muted)">${daysStr}</span>
        </div>
        ${can ? `<div style="display:flex;gap:.5rem;margin-top:.75rem">
          <button class="btn btn-ghost btn-sm" style="flex:1" onclick="editMatch(${m.id})">Modifica</button>
          <button class="btn btn-danger btn-sm" onclick="deleteMatch(${m.id})">✕</button>
        </div>` : ''}
      </div>`;
    }).join('');
  }

  document.getElementById('matches-table').innerHTML = sorted.map(m => {
    const d = new Date(m.date);
    return `<tr>
      <td>${d.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}</td>
      <td><strong>${m.time}</strong></td>
      <td style="font-weight:${m.home==='Il Club'?700:400};color:${m.home==='Il Club'?'var(--gold)':'inherit'}">${m.home}</td>
      <td style="font-weight:${m.away==='Il Club'?700:400};color:${m.away==='Il Club'?'var(--gold)':'inherit'}">${m.away}</td>
      <td><span class="pill pill-gray">${m.comp}</span></td>
      <td><span class="pill ${m.venue==='Casa'?'pill-blue':'pill-gray'}">${m.venue}</span></td>
      ${can?`<td>
        <button class="btn btn-ghost btn-sm" onclick="editMatch(${m.id})">✏</button>
        <button class="btn btn-danger btn-sm" onclick="deleteMatch(${m.id})" style="margin-left:.5rem">✕</button>
      </td>`:''}
    </tr>`;
  }).join('');
}

function openModal(m=null) {
  editingId = m ? m.id : null;
  document.getElementById('modal-title').textContent = m ? 'Modifica Partita' : 'Nuova Partita';
  document.getElementById('f-date').value = m?.date || new Date().toISOString().split('T')[0];
  document.getElementById('f-time').value = m?.time || '15:00';
  document.getElementById('f-home').value = m?.home || 'Il Club';
  document.getElementById('f-away').value = m?.away || '';
  document.getElementById('f-comp').value = m?.comp || 'Serie A';
  document.getElementById('f-venue').value = m?.venue || 'Casa';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function editMatch(id) {
  const m = allUpcoming.find(m => m.id === id);
  if (m) openModal(m);
}

async function saveMatch() {
  const data = {
    date: document.getElementById('f-date').value,
    time: document.getElementById('f-time').value,
    home: document.getElementById('f-home').value.trim(),
    away: document.getElementById('f-away').value.trim(),
    comp: document.getElementById('f-comp').value,
    venue: document.getElementById('f-venue').value,
  };
  if (!data.away) { UI.toast('Inserisci la squadra ospite', 'error'); return; }
  try {
    if (editingId) {
      await DB.updateUpcoming(editingId, data);
      const idx = allUpcoming.findIndex(m => m.id === editingId);
      if (idx > -1) allUpcoming[idx] = { ...allUpcoming[idx], ...data };
      UI.toast('Partita aggiornata', 'success');
    } else {
      const created = await DB.createUpcoming(data);
      if (created) allUpcoming.push(created);
      UI.toast('Partita programmata', 'success');
    }
    closeModal();
    render();
  } catch(e) {
    UI.toast('Errore: ' + e.message, 'error');
  }
}

async function deleteMatch(id) {
  UI.confirm('Rimuovere questa partita?', async () => {
    try {
      await DB.deleteUpcoming(id);
      allUpcoming = allUpcoming.filter(m => m.id !== id);
      UI.toast('Partita rimossa', 'info');
      render();
    } catch(e) {
      UI.toast('Errore: ' + e.message, 'error');
    }
  });
}
</script>
</body>
</html>
