<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IL CLUB — Storico</title>
  <link rel="stylesheet" href="./style/main.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-title">STORICO</span>
      </div>
      <div class="topbar-actions">
        <button class="theme-toggle" onclick="toggleTheme()" title="Cambia tema">🌙</button>
        <button class="btn btn-primary btn-sm" id="add-result-btn" style="display:none" onclick="openModal()">+ Aggiungi partita</button>
      </div>
    </div>
    <div class="page-content">
      <div class="fade-up" style="margin-bottom:2rem">
        <div class="section-header">
          <div>
            <div class="section-title">Storico Risultati</div>
            <div class="section-subtitle">Tutte le competizioni</div>
          </div>
        </div>
        <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1.5rem">
          <select class="form-select" style="width:160px" id="filter-comp" onchange="render()">
            <option value="">Tutte le comp.</option>
            <option>Serie A</option><option>Coppa</option><option>Amichevole</option>
          </select>
          <select class="form-select" style="width:160px" id="filter-result" onchange="render()">
            <option value="">Tutti gli esiti</option>
            <option value="w">Vittorie</option>
            <option value="d">Pareggi</option>
            <option value="l">Sconfitte</option>
          </select>
        </div>
        <div class="stat-grid fade-up delay-1" id="summary-stats"></div>
      </div>
      <div class="fade-up delay-2">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Data</th><th>Casa</th><th></th><th>Risultato</th><th></th>
                <th>Ospite</th><th>Competizione</th><th>Tipo</th><th>Esito</th>
                <th id="act-col" style="display:none">Azioni</th>
              </tr>
            </thead>
            <tbody id="results-body">
              <tr><td colspan="10" style="text-align:center;color:var(--muted);padding:2rem">Caricamento...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="fade-up delay-3" style="margin-top:3rem">
        <div class="section-header">
          <div>
            <div class="section-title">Riepilogo Stagioni</div>
            <div class="section-subtitle">Storico per anno</div>
          </div>
          <button class="btn btn-primary btn-sm" id="add-season-btn" style="display:none" onclick="openSeasonModal()">+ Stagione</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Stagione</th><th>Competizione</th><th>Pos.</th>
                <th>G</th><th>V</th><th>P</th><th>S</th>
                <th>GF</th><th>GS</th><th>Diff</th><th>Pts</th>
                <th id="season-act-col" style="display:none">Azioni</th>
              </tr>
            </thead>
            <tbody id="seasons-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Match Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Nuova Partita</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Data</label><input class="form-input" type="date" id="f-date"></div>
        <div class="form-group">
          <label class="form-label">Competizione</label>
          <select class="form-select" id="f-comp">
            <option>Serie A</option><option>Coppa</option><option>Amichevole</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Squadra Casa</label><input class="form-input" id="f-home" placeholder="Il Club"></div>
        <div class="form-group"><label class="form-label">Squadra Ospite</label><input class="form-input" id="f-away" placeholder="Avversario"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Gol Casa</label><input class="form-input" type="number" id="f-gh" value="0" min="0"></div>
        <div class="form-group"><label class="form-label">Gol Ospite</label><input class="form-input" type="number" id="f-ga" value="0" min="0"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Tipo</label>
        <select class="form-select" id="f-type">
          <option value="home">Casa</option><option value="away">Trasferta</option>
        </select>
      </div>
      <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1rem">
        <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
        <button class="btn btn-primary" onclick="saveResult()">Salva</button>
      </div>
    </div>
  </div>
</div>

<!-- Season Modal -->
<div class="modal-overlay" id="season-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Nuova Stagione</span>
      <button class="modal-close" onclick="closeSeasonModal()">✕</button>
    </div>
    <div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Anno</label><input class="form-input" id="s-year" placeholder="2024/25"></div>
        <div class="form-group"><label class="form-label">Competizione</label><input class="form-input" id="s-comp" placeholder="Serie A Regionale"></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem">
        <div class="form-group"><label class="form-label">Pos</label><input class="form-input" type="number" id="s-pos" value="1"></div>
        <div class="form-group"><label class="form-label">G</label><input class="form-input" type="number" id="s-g" value="30"></div>
        <div class="form-group"><label class="form-label">V</label><input class="form-input" type="number" id="s-w" value="0"></div>
        <div class="form-group"><label class="form-label">P</label><input class="form-input" type="number" id="s-d" value="0"></div>
        <div class="form-group"><label class="form-label">S</label><input class="form-input" type="number" id="s-l" value="0"></div>
        <div class="form-group"><label class="form-label">GF</label><input class="form-input" type="number" id="s-gf" value="0"></div>
        <div class="form-group"><label class="form-label">GS</label><input class="form-input" type="number" id="s-ga" value="0"></div>
      </div>
      <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:.5rem">
        <button class="btn btn-ghost" onclick="closeSeasonModal()">Annulla</button>
        <button class="btn btn-primary" onclick="saveSeason()">Salva</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="./js/app.js"></script>
<script src="./js/sidebar.js"></script>
<script>
let editingId = null;
let allResults = [];
let allSeasons = [];

document.addEventListener('DOMContentLoaded', async () => {
  await AUTH.init();
  const can = AUTH.can('editMatch');
  if (can) {
    document.getElementById('add-result-btn').style.display = '';
    document.getElementById('add-season-btn').style.display = '';
    document.getElementById('act-col').style.display = '';
    document.getElementById('season-act-col').style.display = '';
  }
  try {
    [allResults, allSeasons] = await Promise.all([DB.getResults(), DB.getSeasons()]);
  } catch(e) {
    UI.toast('Errore caricamento: ' + e.message, 'error');
  }
  render();
  renderSeasons();
});

function getResultType(r) {
  const home = r.home === 'Il Club';
  const myG = home ? r.gh : r.ga;
  const oppG = home ? r.ga : r.gh;
  return myG > oppG ? 'w' : myG === oppG ? 'd' : 'l';
}

function render() {
  const compF = document.getElementById('filter-comp').value;
  const resF = document.getElementById('filter-result').value;
  const can = AUTH.can('editMatch');
  let filtered = allResults;
  if (compF) filtered = filtered.filter(r => r.comp === compF);
  if (resF) filtered = filtered.filter(r => getResultType(r) === resF);

  let w=0, d=0, l=0;
  filtered.forEach(r => { const t=getResultType(r); if(t==='w')w++; else if(t==='d')d++; else l++; });
  const ss = document.getElementById('summary-stats');
  ss.innerHTML = [
    {label:'Partite', val:filtered.length, badge:'badge-gold'},
    {label:'Vittorie', val:w, badge:'badge-green'},
    {label:'Pareggi', val:d, badge:'badge-gold'},
    {label:'Sconfitte', val:l, badge:'badge-red'},
  ].map(c=>`<div class="stat-card">
    <div class="stat-label">${c.label}</div>
    <div class="stat-value">${c.val}</div>
    <span class="stat-badge ${c.badge}">${filtered.length > 0 ? Math.round(c.val/filtered.length*100) : 0}%</span>
  </div>`).join('');

  const labels = {w:'V',d:'P',l:'S'};
  const cls = {w:'result-w',d:'result-d',l:'result-l'};
  document.getElementById('results-body').innerHTML = [...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(r=>{
    const t = getResultType(r);
    const dateStr = new Date(r.date).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});
    return `<tr>
      <td style="color:var(--muted);font-size:.8rem">${dateStr}</td>
      <td style="font-weight:${r.home==='Il Club'?700:400};color:${r.home==='Il Club'?'var(--gold)':'var(--white)'}">${r.home}</td>
      <td style="color:var(--muted);font-size:.8rem">vs</td>
      <td><strong>${r.gh} — ${r.ga}</strong></td>
      <td></td>
      <td style="font-weight:${r.away==='Il Club'?700:400};color:${r.away==='Il Club'?'var(--gold)':'var(--white)'}">${r.away}</td>
      <td><span class="pill pill-gray">${r.comp}</span></td>
      <td><span class="pill ${r.type==='home'?'pill-blue':'pill-gray'}">${r.type==='home'?'Casa':'Trasf.'}</span></td>
      <td><span class="${cls[t]}">${labels[t]}</span></td>
      ${can?`<td>
        <button class="btn btn-ghost btn-sm" onclick="editResult(${r.id})">✏</button>
        <button class="btn btn-danger btn-sm" onclick="deleteResult(${r.id})" style="margin-left:.5rem">✕</button>
      </td>`:''}
    </tr>`;
  }).join('');
}

function renderSeasons() {
  const can = AUTH.can('editMatch');
  document.getElementById('seasons-body').innerHTML = allSeasons.map(s=>{
    const pts = s.w*3+s.d;
    const diff = s.gf-s.ga;
    const posColor = s.pos===1?'result-w':s.pos<=3?'result-d':'';
    return `<tr>
      <td><strong>${s.year}</strong></td>
      <td>${s.comp}</td>
      <td><strong class="${posColor}">${s.pos}°</strong></td>
      <td>${s.g}</td><td style="color:var(--green)">${s.w}</td>
      <td style="color:var(--gold)">${s.d}</td>
      <td style="color:var(--red)">${s.l}</td>
      <td>${s.gf}</td><td>${s.ga}</td>
      <td>${diff>=0?'+'+diff:diff}</td>
      <td><strong>${pts}</strong></td>
      ${can?`<td><button class="btn btn-danger btn-sm" onclick="deleteSeason(${s.id})">✕</button></td>`:''}
    </tr>`;
  }).join('');
}

function openModal(r=null) {
  editingId = r ? r.id : null;
  document.getElementById('modal-title').textContent = r ? 'Modifica Partita' : 'Nuova Partita';
  document.getElementById('f-date').value = r ? r.date : new Date().toISOString().split('T')[0];
  document.getElementById('f-comp').value = r ? r.comp : 'Serie A';
  document.getElementById('f-home').value = r ? r.home : 'Il Club';
  document.getElementById('f-away').value = r ? r.away : '';
  document.getElementById('f-gh').value = r ? r.gh : 0;
  document.getElementById('f-ga').value = r ? r.ga : 0;
  document.getElementById('f-type').value = r ? r.type : 'home';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function editResult(id) {
  const r = allResults.find(r => r.id === id);
  if (r) openModal(r);
}

async function saveResult() {
  const data = {
    date: document.getElementById('f-date').value,
    comp: document.getElementById('f-comp').value,
    home: document.getElementById('f-home').value.trim(),
    away: document.getElementById('f-away').value.trim(),
    gh: +document.getElementById('f-gh').value,
    ga: +document.getElementById('f-ga').value,
    type: document.getElementById('f-type').value,
  };
  if (!data.home || !data.away) { UI.toast('Compila le squadre', 'error'); return; }
  try {
    if (editingId) {
      await DB.updateResult(editingId, data);
      const idx = allResults.findIndex(r => r.id === editingId);
      if (idx > -1) allResults[idx] = { ...allResults[idx], ...data };
      UI.toast('Partita aggiornata', 'success');
    } else {
      const created = await DB.createResult(data);
      if (created) allResults.push(created);
      UI.toast('Partita aggiunta', 'success');
    }
    closeModal(); render();
  } catch(e) {
    UI.toast('Errore: ' + e.message, 'error');
  }
}

async function deleteResult(id) {
  UI.confirm('Eliminare questa partita?', async () => {
    try {
      await DB.deleteResult(id);
      allResults = allResults.filter(r => r.id !== id);
      UI.toast('Partita eliminata', 'info');
      render();
    } catch(e) { UI.toast('Errore: ' + e.message, 'error'); }
  });
}

function openSeasonModal() { document.getElementById('season-modal').classList.add('open'); }
function closeSeasonModal() { document.getElementById('season-modal').classList.remove('open'); }

async function saveSeason() {
  const year = document.getElementById('s-year').value.trim();
  if (!year) { UI.toast('Inserisci l\'anno', 'error'); return; }
  const data = {
    year, comp: document.getElementById('s-comp').value.trim(),
    pos: +document.getElementById('s-pos').value,
    g: +document.getElementById('s-g').value,
    w: +document.getElementById('s-w').value,
    d: +document.getElementById('s-d').value,
    l: +document.getElementById('s-l').value,
    gf: +document.getElementById('s-gf').value,
    ga: +document.getElementById('s-ga').value,
  };
  try {
    const created = await DB.createSeason(data);
    if (created) allSeasons.unshift(created);
    UI.toast('Stagione aggiunta', 'success');
    closeSeasonModal(); renderSeasons();
  } catch(e) { UI.toast('Errore: ' + e.message, 'error'); }
}

async function deleteSeason(id) {
  UI.confirm('Eliminare questa stagione?', async () => {
    try {
      await DB.deleteSeason(id);
      allSeasons = allSeasons.filter(s => s.id !== id);
      UI.toast('Stagione eliminata', 'info');
      renderSeasons();
    } catch(e) { UI.toast('Errore: ' + e.message, 'error'); }
  });
}
</script>
</body>
</html>
