<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IL CLUB — Rosa</title>
  <link rel="stylesheet" href="./style/main.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-title">ROSA</span>
      </div>
      <div class="topbar-actions">
        <div id="action-bar"></div>
      </div>
    </div>
    <div class="page-content">
      <div class="section-header fade-up">
        <div>
          <div class="section-title">Rosa della Squadra</div>
          <div class="section-subtitle">Stagione corrente · <span id="player-count">—</span> giocatori</div>
        </div>
        <div style="display:flex;gap:.75rem;align-items:center">
          <select class="form-select" style="width:160px" id="filter-role" onchange="renderPlayers()">
            <option value="">Tutti i ruoli</option>
            <option>Portiere</option><option>Difensore</option>
            <option>Centrocampista</option><option>Ala</option><option>Attaccante</option>
          </select>
          <button class="btn btn-primary btn-sm" id="add-player-btn" style="display:none" onclick="openModal()">+ Aggiungi</button>
        </div>
      </div>
      <div class="grid-auto fade-up delay-1" id="players-grid">
        <div style="grid-column:1/-1;padding:2rem;text-align:center;color:var(--muted)">Caricamento...</div>
      </div>
      <div class="fade-up delay-2" style="margin-top:2.5rem">
        <div class="section-header">
          <div><div class="section-title" style="font-size:1.2rem">Statistiche Rosa</div></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th><th>Giocatore</th><th>Ruolo</th><th>Età</th>
                <th>Presenze</th><th>Gol</th><th>Assist</th>
                <th id="actions-col" style="display:none">Azioni</th>
              </tr>
            </thead>
            <tbody id="players-table"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Nuovo Giocatore</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body">
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Nome</label><input class="form-input" id="f-name" placeholder="Mario Rossi"></div>
        <div class="form-group"><label class="form-label">Numero maglia</label><input class="form-input" id="f-number" type="number" min="1" max="99"></div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Ruolo</label>
          <select class="form-select" id="f-role">
            <option>Portiere</option><option>Difensore</option>
            <option>Centrocampista</option><option>Ala</option><option>Attaccante</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Età</label><input class="form-input" id="f-age" type="number" min="16" max="45"></div>
      </div>
      <div class="grid-3">
        <div class="form-group"><label class="form-label">Presenze</label><input class="form-input" id="f-matches" type="number" value="0"></div>
        <div class="form-group"><label class="form-label">Gol</label><input class="form-input" id="f-goals" type="number" value="0"></div>
        <div class="form-group"><label class="form-label">Assist</label><input class="form-input" id="f-assists" type="number" value="0"></div>
      </div>
      <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1rem">
        <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
        <button class="btn btn-primary" onclick="savePlayer()">Salva</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="./js/app.js"></script>
<script src="./js/sidebar.js"></script>
<script>
let editingId = null;
let allPlayers = [];
const roleColors = { Portiere:'blue', Difensore:'green', Centrocampista:'gold', Ala:'gold', Attaccante:'red' };

document.addEventListener('DOMContentLoaded', async () => {
  await AUTH.init();
  const canEdit = AUTH.can('editPlayer');
  if (canEdit) {
    document.getElementById('add-player-btn').style.display = '';
    document.getElementById('actions-col').style.display = '';
  }
  try {
    allPlayers = await DB.getPlayers();
  } catch(e) {
    UI.toast('Errore caricamento giocatori: ' + e.message, 'error');
  }
  renderPlayers();
});

function renderPlayers() {
  const filter = document.getElementById('filter-role').value;
  const filtered = filter ? allPlayers.filter(p => p.role === filter) : allPlayers;
  const canEdit = AUTH.can('editPlayer');
  document.getElementById('player-count').textContent = filtered.length;

  const groups = {};
  filtered.forEach(p => { (groups[p.role] || (groups[p.role] = [])).push(p); });

  let gridHtml = '';
  Object.entries(groups).forEach(([role, ps]) => {
    gridHtml += `<div style="grid-column:1/-1;display:flex;align-items:center;gap:.75rem;margin-top:.5rem">
      <span class="pill pill-${roleColors[role]||'gray'}">${role}</span>
      <div style="flex:1;height:1px;background:var(--border)"></div>
    </div>`;
    ps.forEach(p => {
      gridHtml += `<div class="player-card">
        <div class="player-number">${p.number}</div>
        <div class="player-name">${p.name}</div>
        <div class="player-role">${p.role}</div>
        <div style="display:flex;justify-content:center;gap:1.5rem;margin-top:1rem;font-size:.78rem;color:var(--muted)">
          <span><strong style="color:var(--white)">${p.goals||0}</strong> Gol</span>
          <span><strong style="color:var(--white)">${p.assists||0}</strong> Ast</span>
          <span><strong style="color:var(--white)">${p.matches||0}</strong> Pres</span>
        </div>
        ${canEdit ? `<button class="btn btn-ghost btn-sm" style="margin-top:1rem;width:100%" onclick="editPlayer(${p.id})">Modifica</button>` : ''}
      </div>`;
    });
  });
  if (!gridHtml) gridHtml = `<div style="grid-column:1/-1;padding:2rem;text-align:center;color:var(--muted)">Nessun giocatore trovato</div>`;
  document.getElementById('players-grid').innerHTML = gridHtml;

  document.getElementById('players-table').innerHTML = [...filtered].sort((a,b)=>a.number-b.number).map(p=>`
    <tr>
      <td><strong style="color:var(--gold)">${p.number}</strong></td>
      <td><strong>${p.name}</strong></td>
      <td><span class="pill pill-${roleColors[p.role]||'gray'}">${p.role}</span></td>
      <td>${p.age||'—'}</td>
      <td>${p.matches||0}</td>
      <td><strong>${p.goals||0}</strong></td>
      <td>${p.assists||0}</td>
      ${canEdit ? `<td>
        <button class="btn btn-ghost btn-sm" onclick="editPlayer(${p.id})">✏</button>
        <button class="btn btn-danger btn-sm" onclick="deletePlayer(${p.id})" style="margin-left:.5rem">✕</button>
      </td>` : ''}
    </tr>
  `).join('');
}

function openModal(player=null) {
  editingId = player ? player.id : null;
  document.getElementById('modal-title').textContent = player ? 'Modifica Giocatore' : 'Nuovo Giocatore';
  document.getElementById('f-name').value = player?.name || '';
  document.getElementById('f-number').value = player?.number || '';
  document.getElementById('f-role').value = player?.role || 'Portiere';
  document.getElementById('f-age').value = player?.age || '';
  document.getElementById('f-matches').value = player?.matches ?? 0;
  document.getElementById('f-goals').value = player?.goals ?? 0;
  document.getElementById('f-assists').value = player?.assists ?? 0;
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function editPlayer(id) {
  const p = allPlayers.find(p => p.id === id);
  if (p) openModal(p);
}

async function savePlayer() {
  const data = {
    name: document.getElementById('f-name').value.trim(),
    number: +document.getElementById('f-number').value,
    role: document.getElementById('f-role').value,
    age: +document.getElementById('f-age').value,
    matches: +document.getElementById('f-matches').value,
    goals: +document.getElementById('f-goals').value,
    assists: +document.getElementById('f-assists').value,
  };
  if (!data.name || !data.number) { UI.toast('Compila nome e numero', 'error'); return; }
  try {
    if (editingId) {
      const updated = await DB.updatePlayer(editingId, data);
      const idx = allPlayers.findIndex(p => p.id === editingId);
      if (idx > -1) allPlayers[idx] = { ...allPlayers[idx], ...data };
      UI.toast('Giocatore aggiornato', 'success');
    } else {
      const created = await DB.createPlayer(data);
      if (created) allPlayers.push(created);
      UI.toast('Giocatore aggiunto', 'success');
    }
    closeModal();
    renderPlayers();
  } catch(e) {
    UI.toast('Errore: ' + e.message, 'error');
  }
}

async function deletePlayer(id) {
  UI.confirm('Rimuovere questo giocatore?', async () => {
    try {
      await DB.deletePlayer(id);
      allPlayers = allPlayers.filter(p => p.id !== id);
      UI.toast('Giocatore rimosso', 'info');
      renderPlayers();
    } catch(e) {
      UI.toast('Errore: ' + e.message, 'error');
    }
  });
}
</script>
</body>
</html>
