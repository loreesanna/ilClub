<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IL CLUB — Accesso</title>
  <link rel="stylesheet" href="./style/main.css">
</head>
<body>
<div class="login-page">
  <div class="login-bg"></div>

  <div class="login-box fade-up">
    <div class="login-logo">
      <img src="./style/img/logov2.png" alt="IL CLUB Logo">
      <div class="login-title">IL CLUB</div>
      <div class="login-divider"></div>
      <p style="font-size:.75rem;color:var(--muted);margin-top:.5rem">Football Society — Area Riservata</p>
    </div>

    <div class="login-tab-group" id="tabs">
      <div class="login-tab active" onclick="switchTab('login')">Accedi</div>
      <div class="login-tab" onclick="switchTab('register')">Registrati</div>
    </div>

    <!-- LOGIN -->
    <div id="panel-login">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="login-user" type="text" placeholder="Il tuo username" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem" id="login-submit" onclick="doLogin()">
        Entra
      </button>
      <div id="login-error" style="display:none;margin-top:.75rem;font-size:.8rem;color:var(--red);text-align:center"></div>
    </div>

    <!-- REGISTER -->
    <div id="panel-register" style="display:none">
      <div class="form-group">
        <label class="form-label">Nome completo</label>
        <input class="form-input" id="reg-name" type="text" placeholder="Mario Rossi">
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="reg-user" type="text" placeholder="mario_rossi">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="reg-pass" type="password" placeholder="••••••••">
      </div>
      <p style="font-size:.72rem;color:var(--muted);margin-bottom:1rem">
        I nuovi account vengono creati come <span style="color:var(--blue)">Fan</span>. Contatta un membro dello staff per l'upgrade.
      </p>
      <button class="btn btn-primary" style="width:100%;justify-content:center" id="reg-submit" onclick="doRegister()">
        Crea account
      </button>
      <div id="reg-error" style="display:none;margin-top:.75rem;font-size:.8rem;color:var(--red);text-align:center"></div>
    </div>

    <p style="font-size:.7rem;color:var(--muted2);text-align:center;margin-top:1.5rem">
      Puoi navigare come ospite senza account.
      <a href="index.html" style="color:var(--gold);text-decoration:none">Continua come ospite →</a>
    </p>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="./js/app.js"></script>
<script>
  AUTH.init().then(() => {
    if (AUTH.currentUser) window.location.href = 'index.html';
  });

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    if (btn) {
      btn.disabled = loading;
      btn.textContent = loading ? 'Attendere...' : (btnId === 'login-submit' ? 'Entra' : 'Crea account');
    }
  }

  function showError(elId, msg) {
    const el = document.getElementById(elId);
    if (el) { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }
  }

  function switchTab(tab) {
    document.querySelectorAll('.login-tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
    document.getElementById('panel-login').style.display     = tab === 'login'    ? '' : 'none';
    document.getElementById('panel-register').style.display  = tab === 'register' ? '' : 'none';
    showError('login-error', '');
    showError('reg-error', '');
  }

  async function doLogin() {
    const u = document.getElementById('login-user').value.trim();
    const p = document.getElementById('login-pass').value;
    if (!u || !p) { showError('login-error', 'Inserisci username e password.'); return; }
    setLoading('login-submit', true);
    showError('login-error', '');
    const res = await AUTH.login(u, p);
    setLoading('login-submit', false);
    if (res.ok) {
      UI.toast(`Benvenuto, ${res.user.name}!`, 'success');
      setTimeout(() => window.location.href = 'index.html', 800);
    } else {
      showError('login-error', res.error);
    }
  }

  async function doRegister() {
    const name = document.getElementById('reg-name').value.trim();
    const user = document.getElementById('reg-user').value.trim();
    const pass = document.getElementById('reg-pass').value;
    if (!name || !user || !pass) { showError('reg-error', 'Compila tutti i campi.'); return; }
    setLoading('reg-submit', true);
    showError('reg-error', '');
    const res = await AUTH.register(user, pass, name);
    setLoading('reg-submit', false);
    if (res.ok) {
      UI.toast('Account creato! Ora accedi.', 'success');
      switchTab('login');
    } else {
      showError('reg-error', res.error);
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const isLogin = document.getElementById('panel-register').style.display === 'none';
      if (isLogin) doLogin(); else doRegister();
    }
  });
</script>
</body>
</html>
