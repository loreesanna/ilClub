<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IL CLUB — Accesso</title>
  <link rel="stylesheet" href="./style/main.css">
</head>
<body>
<div class="login-page">
  <div class="login-bg"></div>

  <div class="login-box fade-up">
    <div class="login-logo">
      <img src="./style/img/logov2.png" alt="IL CLUB Logo">
      <div class="login-title">IL CLUB</div>
      <div class="login-divider"></div>
      <p style="font-size:.75rem;color:var(--muted);margin-top:.5rem">Il Club — Area Riservata <br> Potrai accedere solo in quanto membro</p>
    </div>

    <!-- LOGIN ONLY — niente tab registrazione -->
    <div id="panel-login">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="login-user" type="text" placeholder="Il tuo username" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem" id="login-submit" onclick="doLogin()">
        Entra
      </button>
      <div id="login-error" style="display:none;margin-top:.75rem;font-size:.8rem;color:var(--red);text-align:center"></div>
    </div>

    <p style="font-size:.7rem;color:var(--muted2);text-align:center;margin-top:1.5rem">
      Puoi navigare come ospite senza account.
      <a href="index.html" style="color:var(--gold);text-decoration:none">Continua come ospite →</a>
    </p>
    <p style="font-size:.65rem;color:var(--muted2);text-align:center;margin-top:.75rem">
      Per richiedere un account contatta l'amministratore.
    </p>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="./js/app.js"></script>
<script>
  AUTH.init().then(() => {
    if (AUTH.currentUser) window.location.href = 'index.html';
  });

  function setLoading(loading) {
    const btn = document.getElementById('login-submit');
    if (btn) { btn.disabled = loading; btn.textContent = loading ? 'Attendere...' : 'Entra'; }
  }

  function showError(msg) {
    const el = document.getElementById('login-error');
    if (el) { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }
  }

  async function doLogin() {
    const u = document.getElementById('login-user').value.trim();
    const p = document.getElementById('login-pass').value;
    if (!u || !p) { showError('Inserisci username e password.'); return; }
    setLoading(true);
    showError('');
    const res = await AUTH.login(u, p);
    setLoading(false);
    if (res.ok) {
      UI.toast(`Benvenuto, ${res.user.name}!`, 'success');
      setTimeout(() => window.location.href = 'index.html', 800);
    } else {
      showError(res.error);
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
