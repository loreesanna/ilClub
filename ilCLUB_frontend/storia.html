<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IL CLUB — Storia</title>
  <link rel="stylesheet" href="./style/main.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div class="topbar">
      <span class="topbar-title">STORIA</span>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="add-history-btn" style="display:none" onclick="openModal()">+ Aggiungi</button>
      </div>
    </div>
    <div class="page-content">

      <!-- Hero -->
      <div class="fade-up" style="margin-bottom:3rem;padding:3rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;position:relative;overflow:hidden">
        <div style="position:absolute;top:-40px;right:-40px;font-family:'Bebas Neue',sans-serif;font-size:12rem;color:rgba(201,168,76,0.04);line-height:1;pointer-events:none" id="founded-bg"></div>
        <div style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap">
          <img src="./style/img/logov2.png" alt="IL CLUB" style="width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(201,168,76,0.4))">
          <div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:6px;color:var(--white);line-height:1" id="hero-name">IL CLUB</div>
            <div style="font-size:.85rem;color:var(--muted);margin-top:.5rem" id="hero-info">Caricamento...</div>
          </div>
        </div>
        <div style="margin-top:2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.5rem" id="team-info-grid"></div>
        <button class="btn btn-ghost btn-sm" id="edit-info-btn" style="display:none;margin-top:1.5rem" onclick="openInfoModal()">✏ Modifica info squadra</button>
      </div>

      <!-- Timeline -->
      <div class="fade-up delay-1">
        <div class="section-header">
          <div>
            <div class="section-title">La nostra Storia</div>
            <div class="section-subtitle">Dalla fondazione ad oggi</div>
          </div>
        </div>
        <div class="timeline" id="timeline">
          <div style="padding:2rem;text-align:center;color:var(--muted)">Caricamento...</div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- History event modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Nuovo Evento</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Anno</label><input class="form-input" id="f-year" placeholder="2024"></div>
        <div class="form-group"><label class="form-label">Titolo</label><input class="form-input" id="f-title" placeholder="Nome evento"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Descrizione</label>
        <textarea class="form-textarea" id="f-text" rows="4" placeholder="Racconta cosa è successo..."></textarea>
      </div>
      <div style="display:flex;gap:.75rem;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
        <button class="btn btn-primary" onclick="saveEvent()">Salva</button>
      </div>
    </div>
  </div>
</div>

<!-- Team info modal -->
<div class="modal-overlay" id="info-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Info Squadra</span>
      <button class="modal-close" onclick="closeInfoModal()">✕</button>
    </div>
    <div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Nome squadra</label><input class="form-input" id="i-name"></div>
        <div class="form-group"><label class="form-label">Anno fondazione</label><input class="form-input" id="i-founded" type="number"></div>
        <div class="form-group"><label class="form-label">Stadio</label><input class="form-input" id="i-stadium"></div>
        <div class="form-group"><label class="form-label">Città</label><input class="form-input" id="i-city"></div>
        <div class="form-group"><label class="form-label">Colori</label><input class="form-input" id="i-colors"></div>
        <div class="form-group"><label class="form-label">Allenatore</label><input class="form-input" id="i-coach"></div>
        <div class="form-group"><label class="form-label">Presidente</label><input class="form-input" id="i-president"></div>
      </div>
      <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:.5rem">
        <button class="btn btn-ghost" onclick="closeInfoModal()">Annulla</button>
        <button class="btn btn-primary" onclick="saveInfo()">Salva</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="./js/app.js"></script>
<script src="./js/sidebar.js"></script>
<script>
let editingId = null;
let allHistory = [];
let teamData = null;

document.addEventListener('DOMContentLoaded', async () => {
  await AUTH.init();
  const can = AUTH.can('editHistory');
  if (can) {
    document.getElementById('add-history-btn').style.display = '';
    document.getElementById('edit-info-btn').style.display = '';
  }
  try {
    [teamData, allHistory] = await Promise.all([DB.getTeam(), DB.getHistory()]);
  } catch(e) {
    UI.toast('Errore caricamento: ' + e.message, 'error');
  }
  renderHero();
  renderTimeline();
});

function renderHero() {
  const t = teamData;
  if (!t) return;
  document.getElementById('founded-bg').textContent = t.founded || '';
  document.getElementById('hero-name').textContent = t.name || 'IL CLUB';
  document.getElementById('hero-info').textContent = `Football Society · Fondato nel ${t.founded||'—'} · ${t.city||'—'}`;
  const infos = [
    { label:'Fondato', val: t.founded||'—' },
    { label:'Stadio', val: t.stadium||'—' },
    { label:'Città', val: t.city||'—' },
    { label:'Colori', val: t.colors||'—' },
    { label:'Allenatore', val: t.coach||'—' },
    { label:'Presidente', val: t.president||'—' },
  ];
  document.getElementById('team-info-grid').innerHTML = infos.map(i=>`
    <div>
      <div style="font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:600;margin-bottom:.25rem">${i.label}</div>
      <div style="font-weight:600;color:var(--white)">${i.val}</div>
    </div>
  `).join('');
}

function renderTimeline() {
  const can = AUTH.can('editHistory');
  const sorted = [...allHistory].sort((a,b) => +a.year - +b.year);
  const timeline = document.getElementById('timeline');
  if (sorted.length === 0) {
    timeline.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--muted)">Nessun evento storico ancora inserito.</div>';
    return;
  }
  timeline.innerHTML = sorted.map(h=>`
    <div class="timeline-item">
      <div class="timeline-dot"></div>
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem">
        <div style="flex:1">
          <div class="timeline-year">${h.year}</div>
          <div class="timeline-title">${h.title}</div>
          <div class="timeline-text">${h.text}</div>
        </div>
        ${can ? `<div style="display:flex;gap:.5rem;flex-shrink:0">
          <button class="btn btn-ghost btn-sm" onclick="editEvent(${h.id})">✏</button>
          <button class="btn btn-danger btn-sm" onclick="deleteEvent(${h.id})">✕</button>
        </div>` : ''}
      </div>
    </div>
  `).join('');
}

function openModal(h=null) {
  editingId = h ? h.id : null;
  document.getElementById('modal-title').textContent = h ? 'Modifica Evento' : 'Nuovo Evento';
  document.getElementById('f-year').value = h?.year || '';
  document.getElementById('f-title').value = h?.title || '';
  document.getElementById('f-text').value = h?.text || '';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function editEvent(id) {
  const h = allHistory.find(h => h.id === id);
  if (h) openModal(h);
}

async function saveEvent() {
  const data = {
    year: document.getElementById('f-year').value.trim(),
    title: document.getElementById('f-title').value.trim(),
    text: document.getElementById('f-text').value.trim(),
  };
  if (!data.year || !data.title) { UI.toast('Compila anno e titolo', 'error'); return; }
  try {
    if (editingId) {
      await DB.updateHistoryEntry(editingId, data);
      const idx = allHistory.findIndex(h => h.id === editingId);
      if (idx > -1) allHistory[idx] = { ...allHistory[idx], ...data };
      UI.toast('Evento aggiornato', 'success');
    } else {
      const created = await DB.createHistoryEntry(data);
      if (created) allHistory.push(created);
      UI.toast('Evento aggiunto', 'success');
    }
    closeModal(); renderTimeline();
  } catch(e) { UI.toast('Errore: ' + e.message, 'error'); }
}

async function deleteEvent(id) {
  UI.confirm('Eliminare questo evento?', async () => {
    try {
      await DB.deleteHistoryEntry(id);
      allHistory = allHistory.filter(h => h.id !== id);
      UI.toast('Evento eliminato', 'info');
      renderTimeline();
    } catch(e) { UI.toast('Errore: ' + e.message, 'error'); }
  });
}

function openInfoModal() {
  const t = teamData || {};
  ['name','stadium','city','colors','coach','president'].forEach(k => {
    document.getElementById('i-'+k).value = t[k] || '';
  });
  document.getElementById('i-founded').value = t.founded || '';
  document.getElementById('info-modal').classList.add('open');
}
function closeInfoModal() { document.getElementById('info-modal').classList.remove('open'); }

async function saveInfo() {
  const data = {};
  ['name','stadium','city','colors','coach','president'].forEach(k => {
    data[k] = document.getElementById('i-'+k).value.trim();
  });
  data.founded = +document.getElementById('i-founded').value;
  try {
    await DB.updateTeam(data);
    teamData = { ...teamData, ...data };
    UI.toast('Info aggiornate', 'success');
    closeInfoModal(); renderHero();
  } catch(e) { UI.toast('Errore: ' + e.message, 'error'); }
}
</script>
</body>
</html>
